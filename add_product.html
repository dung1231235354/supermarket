<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add New Product</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Fraunces:wght@700;900&display=swap" rel="stylesheet">
<style>
    body { margin: 0; font-family: 'DM Sans', sans-serif; background-color: #fdf8e7; color: #1a1a1a; }
    .header { display: flex; justify-content: space-between; padding: 20px 40px; text-transform: uppercase; font-size: 13px; font-weight: 700; border-bottom: 2px solid #000; }
    .main-content { max-width: 600px; margin: 40px auto; background-color: #fff; padding: 40px; border: 2px solid #000; box-shadow: 8px 8px 0px #000; }
    h1 { font-family: 'Fraunces', serif; font-size: 36px; margin: 0 0 20px 0; }
    .form-group { margin-bottom: 15px; }
    .form-row-double { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    label { display: block; font-weight: 700; text-transform: uppercase; font-size: 12px; margin-bottom: 8px; }
    input, select, textarea { width: 100%; padding: 12px; font-size: 14px; border: 2px solid #000; box-sizing: border-box; font-family: 'DM Sans', sans-serif; }
    .cta-btn { background-color: #f4c242; color: #000; border: 2px solid #000; padding: 15px; font-weight: 700; text-transform: uppercase; cursor: pointer; width: 100%; }
</style>
</head>
<body>
    <div class="header"><div>SUPERMARKET</div><div>INVENTORY SYSTEM</div></div>
    <div style="padding: 0 40px; margin-top: 20px;"><a href="indexx.php"><button class="cta-btn" style="width: auto;">← GO BACK</button></a></div>
    
    <div class="main-content">
        <h1>Add Product</h1>
        <form action="add_product.php" method="POST">
            <div class="form-group"><label>Product Name:</label><input type="text" name="name" required></div>
            <div class="form-row-double">
                <div class="form-group"><label>Category:</label><input type="text" name="category"></div>
                <div class="form-group"><label>Supplier ID:</label><input type="number" name="supplier_id" min="1"></div>
            </div>
            <div class="form-row-double">
                <div class="form-group"><label>Price ($):</label><input type="number" name="price" step="0.01" required min="0"></div>
                <div class="form-group"><label>Initial Stock:</label><input type="number" name="stock" value="0" min="0"></div>
            </div>
            <div class="form-row-double">
                <div class="form-group"><label>Manufacture Date:</label><input type="date" name="manufacture_date"></div>
                <div class="form-group"><label>Expiry Date:</label><input type="date" name="expiry_date"></div>
            </div>
            <div class="form-group">
                <label>Status:</label>
                <select name="status">
                    <option value="available">Available</option>
                    <option value="out_of_stock">Out of Stock</option>
                    <option value="discontinued">Discontinued</option>
                </select>
            </div>
            <div class="form-group">
                <label>Description:</label>
                <textarea name="description" rows="3"></textarea>
            </div>
            <button type="submit" class="cta-btn">Add to Inventory</button>
        </form>
    </div>
</body>
</html>
