<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Update Supplier</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Fraunces:wght@700;900&display=swap" rel="stylesheet">
<style>
    body { margin: 0; font-family: 'DM Sans', sans-serif; background-color: #fdf8e7; color: #1a1a1a; }
    .header { display: flex; justify-content: space-between; padding: 20px 40px; text-transform: uppercase; font-size: 13px; font-weight: 700; border-bottom: 2px solid #000; }
    .main-content { max-width: 600px; margin: 40px auto; background-color: #fff; padding: 40px; border: 2px solid #000; box-shadow: 8px 8px 0px #000; }
    h1 { font-family: 'Fraunces', serif; font-size: 36px; margin: 0 0 10px 0; }
    .form-group { margin-bottom: 15px; }
    .form-row-double { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    label { display: block; font-weight: 700; text-transform: uppercase; font-size: 12px; margin-bottom: 8px; }
    input, select, textarea { width: 100%; padding: 12px; font-size: 14px; border: 2px solid #000; box-sizing: border-box; font-family: 'DM Sans', sans-serif; }
    .cta-btn { background-color: #f4c242; color: #000; border: 2px solid #000; padding: 15px; font-weight: 700; text-transform: uppercase; cursor: pointer; width: 100%; }
</style>
</head>
<body>
    <div class="header"><div>SUPERMARKET</div><div>INVENTORY SYSTEM</div></div>
    <div style="padding: 0 40px; margin-top: 20px;"><a href="indexx.php"><button class="cta-btn" style="width: auto;">← GO BACK</button></a></div>
    
    <div class="main-content">
        <h1>Update Supplier</h1>
        <p style="font-size: 12px;"><strong>Smart Update:</strong> Leave boxes blank to keep current data.</p>
        <form action="update_supplier.php" method="POST">
            <div class="form-group" style="background-color: #f4c242; padding: 10px; border: 2px solid #000;">
                <label>Supplier ID (Required):</label>
                <input type="number" name="supplier_id" required min="1">
            </div>
            
            <div class="form-group"><label>New Company Name:</label><input type="text" name="name"></div>
            
            <div class="form-row-double">
                <div class="form-group"><label>New Contact:</label><input type="text" name="contact"></div>
                <div class="form-group"><label>New Email:</label><input type="email" name="email"></div>
            </div>
            
            <div class="form-row-double">
                <div class="form-group"><label>New Type:</label><input type="text" name="type"></div>
                <div class="form-group"><label>New Country:</label><input type="text" name="country"></div>
            </div>
            
            <div class="form-group"><label>New Address:</label><input type="text" name="address"></div>
            
            <div class="form-row-double">
                <div class="form-group"><label>New Website:</label><input type="text" name="website" placeholder="www.example.com"></div>
                <div class="form-group">
                    <label>Change Status:</label>
                    <select name="status">
                        <option value="">-- Don't Change --</option>
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group"><label>New Description:</label><textarea name="description" rows="2"></textarea></div>

            <button type="submit" class="cta-btn">Apply Updates</button>
        </form>
    </div>
</body>
</html>
