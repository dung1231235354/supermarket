    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 700; text-transform: uppercase; font-size: 12px; margin-bottom: 8px; }

    .cta-btn { background-color: #fff; color: #000; border: 2px solid #000; padding: 10px 20px; font-weight: 700; text-transform: uppercase; cursor: pointer; display: inline-block; text-decoration: none;}

<body>
    <div class="header"><div>SUPERMARKET</div><div>INVENTORY SYSTEM</div></div>

    <div class="main-content">
        <h1>Delete Record</h1>
        

        <form action="delete.php" method="POST">
            <div class="form-group" style="background-color: #f4c242; padding: 15px; border: 2px solid #000;">
                <label>Chọn bảng chứa dữ liệu cần xóa:</label>
                <select name="table_name" required>
                    <option value="product">Product (Sản phẩm)</option>
                    <option value="customer">Customer (Khách hàng)</option>
                    <option value="supplier">Supplier (Nhà cung cấp)</option>
                    <option value="transaction">Transaction (Giao dịch)</option>

            </div>
            
            <div class="form-group">
                <label>Nhập ID cần xóa (Bắt buộc):</label>

            <button type="submit" class="submit-btn" onclick="return confirm('Bạn có chắc chắn muốn XÓA VĨNH VIỄN dữ liệu này không?');">XÓA DỮ LIỆU</button>
