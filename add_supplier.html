    .main-content { max-width: 600px; margin: 40px auto; background-color: #fff; padding: 40px; border: 2px solid #000; box-shadow: 8px 8px 0px #000; }
    h1 { font-family: 'Fraunces', serif; font-size: 36px; margin: 0 0 20px 0; }
    .form-group { margin-bottom: 15px; }
    .form-row-double { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

<body>
    <div class="header"><div>SUPERMARKET</div><div>INVENTORY SYSTEM</div></div>
    <div style="padding: 0 40px; margin-top: 20px;"><a href="indexx.php"><button class="cta-btn" style="width: auto;">← GO BACK</button></a></div>
    
    <div class="main-content">
        <h1>Add Supplier</h1>
        <form action="add_supplier.php" method="POST">
            <div class="form-group"><label>Company Name:</label><input type="text" name="name" required></div>
            <div class="form-row-double">
                <div class="form-group"><label>Contact Person:</label><input type="text" name="contact"></div>
                <div class="form-group"><label>Email:</label><input type="email" name="email"></div>
            </div>
            <div class="form-row-double">
                <div class="form-group"><label>Type (e.g. Distributor):</label><input type="text" name="type"></div>
                <div class="form-group"><label>Country:</label><input type="text" name="country"></div>
            </div>
            <div class="form-group"><label>Address:</label><input type="text" name="address"></div>
            <div class="form-group"><label>Website:</label><input type="text" name="website" placeholder="www.example.com"></div>
            <div class="form-group">
                <label>Status:</label>
                <select name="status">
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                </select>
            </div>
            <div class="form-group"><label>Description:</label><textarea name="description" rows="3"></textarea></div>
            <button type="submit" class="cta-btn">Add Supplier</button>
        </form>
    </div>
